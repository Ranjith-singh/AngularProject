<table class="table">
    <tr>
        <th>postId</th>
        <th>id</th>
        <th>name</th>
        <th>email</th>
    </tr>
    @for(comment of comments$ | async; let i=$index; track i){
        <tr>
            <td>{{comment.postId}}</td>
            <td>{{comment.id}}</td>
            <td>{{comment.name}}</td>
            <td>{{comment.email}}</td>
        </tr>
    }
</table>
