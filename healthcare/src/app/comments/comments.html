<table class="table">
    <tbody>
        <tr>
            <th>ID</th>
            <th>Post ID</th>
            <th>Name</th>
            <th>Email</th>
        </tr>
        @for(comment of comments$ | async; track $index) {
            <tr>
                <td>{{comment.id}}</td>
                <td>{{comment.postId}}</td>
                <td>{{comment.name}}</td>
                <td>{{comment.email}}</td>
            </tr>
        }
    </tbody>
</table>
